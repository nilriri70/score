<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>점수별 통계보기 - 자동채점 프로그램</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="/static/js/statistics.js" defer></script>
</head>
<body>
  <header class="topbar">
    <nav class="topbar-inner" aria-label="주 메뉴">
      <a href="/" class="topbar-link">🏠 채점프로그램 Home</a>
      <a href="/statistics" class="topbar-link" aria-current="page">📊 점수별 통계보기</a>
    </nav>
  </header>

  <main class="container">
    <section class="card stats-header">
      <h1 class="card-title" style="font-size: 1.15rem;">📊 회차별 점수 분포 통계</h1>
      <div class="action-buttons" style="align-items: center;">
        <label class="form-label" for="stats-round-select">회차 선택</label>
        <select class="form-select" id="stats-round-select" style="inline-size: auto; min-inline-size: 200px;"></select>
        <a href="/" class="btn">← 채점으로 돌아가기</a>
      </div>
    </section>

    <section class="stats-top-row">
      <article class="card">
        <div class="card-header">
          <h2 class="card-title">해당 회차의 총점수 비율(명)</h2>
          <span class="badge badge-blue" id="stats-total-count">총 0명</span>
        </div>
        <div class="pie-box">
          <canvas id="chart-total"></canvas>
        </div>
      </article>
    </section>

    <section class="stats-sub-grid">
      <article class="card">
        <div class="card-header">
          <h2 class="card-title">문제1 비율(명) — 기본작업 [20점]</h2>
        </div>
        <div class="pie-box">
          <canvas id="chart-p1"></canvas>
        </div>
      </article>

      <article class="card">
        <div class="card-header">
          <h2 class="card-title">문제2 비율(명) — 계산작업 [40점]</h2>
        </div>
        <div class="pie-box">
          <canvas id="chart-p2"></canvas>
        </div>
      </article>

      <article class="card">
        <div class="card-header">
          <h2 class="card-title">문제3 비율(명) — 분석작업 [20점]</h2>
        </div>
        <div class="pie-box">
          <canvas id="chart-p3"></canvas>
        </div>
      </article>

      <article class="card">
        <div class="card-header">
          <h2 class="card-title">문제4 비율(명) — 기타작업 [20점]</h2>
        </div>
        <div class="pie-box">
          <canvas id="chart-p4"></canvas>
        </div>
      </article>
    </section>
  </main>

  <footer class="footer">
    © 2026 컴퓨터활용능력 2급 실기 자동채점 프로그램 (뼈대)
  </footer>
</body>
</html>
